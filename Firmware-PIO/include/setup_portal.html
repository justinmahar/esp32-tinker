<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Stats Counter Setup</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #111;
        color: #e8e8e8;
        font-family: system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1rem;
      }
      .card {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 14px;
        width: 100%;
        max-width: 360px;
        overflow: hidden;
      }
      .header {
        background: #0d0d0d;
        padding: 18px 22px;
        border-bottom: 1px solid #222;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .dot {
        width: 28px;
        height: 28px;
        background: #22c55e;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 700;
        color: #0a2e18;
      }
      h1 {
        font-size: 15px;
        font-weight: 600;
        color: #f0f0f0;
      }
      .sub {
        font-size: 12px;
        color: #555;
        margin-top: 3px;
      }
      .body {
        padding: 20px 22px 24px;
        display: flex;
        flex-direction: column;
        gap: 13px;
      }
      .status {
        background: #0a1a10;
        border: 1px solid #1a3a20;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 12px;
        color: #4ade80;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot-green {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #22c55e;
        flex-shrink: 0;
      }
      .section {
        font-size: 11px;
        font-weight: 600;
        color: #555;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      label {
        font-size: 11px;
        font-weight: 600;
        color: #777;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        display: block;
        margin-bottom: 4px;
      }
      input[type="text"],
      input[type="password"],
      input[type="url"],
      input[type="number"] {
        width: 100%;
        background: #1c1c1c;
        border: 1px solid #2e2e2e;
        border-radius: 8px;
        padding: 9px 12px;
        font-size: 13px;
        color: #e8e8e8;
        outline: none;
      }
      input[type="text"]:focus,
      input[type="password"]:focus,
      input[type="url"]:focus,
      input[type="number"]:focus {
        border-color: #22c55e;
      }
      .checks {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #1c1c1c;
        border: 1px solid #2e2e2e;
        border-radius: 8px;
        padding: 9px 12px;
        font-size: 13px;
        color: #e8e8e8;
      }
      .check input {
        accent-color: #22c55e;
      }
      .check span {
        font-size: 13px;
        color: #e8e8e8;
        text-transform: none;
        letter-spacing: 0;
      }
      input::placeholder {
        color: #444;
      }
      .hint {
        font-size: 11px;
        color: #555;
        margin-top: 3px;
      }
      .divider {
        height: 1px;
        background: #222;
      }
      .btn {
        width: 100%;
        background: #22c55e;
        color: #0a2e18;
        border: none;
        border-radius: 8px;
        padding: 11px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 4px;
      }
      .btn:hover {
        background: #1daa50;
      }
      .btn-ota {
        width: 100%;
        background: #1c1c1c;
        color: #e8e8e8;
        border: 1px solid #2e2e2e;
        border-radius: 8px;
        padding: 11px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        margin-top: 4px;
      }
      .btn-ota:hover {
        background: #252525;
      }
      .msg {
        font-size: 13px;
        text-align: center;
        padding: 8px;
        border-radius: 8px;
        display: none;
      }
      .msg.ok {
        background: #0a1a10;
        color: #4ade80;
        border: 1px solid #1a3a20;
        display: block;
      }
      .msg.err {
        background: #1a0a0a;
        color: #f87171;
        border: 1px solid #3a1a1a;
        display: block;
      }
      .msg.info {
        background: #0a0e1a;
        color: #60a5fa;
        border: 1px solid #1a2a3a;
        display: block;
      }
      .progress-wrap {
        background: #1c1c1c;
        border-radius: 8px;
        height: 8px;
        overflow: hidden;
        display: none;
      }
      .progress-wrap.show {
        display: block;
      }
      .progress-bar {
        height: 100%;
        width: 0%;
        background: #22c55e;
        border-radius: 8px;
        transition: width 0.2s;
      }
      input[type="file"] {
        width: 100%;
        background: #1c1c1c;
        border: 1px solid #2e2e2e;
        border-radius: 8px;
        padding: 8px 12px;
        font-size: 13px;
        color: #888;
        outline: none;
        cursor: pointer;
      }
      input[type="file"]::file-selector-button {
        background: #22c55e;
        color: #0a2e18;
        border: none;
        border-radius: 6px;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        margin-right: 10px;
      }
      .btn-scan {
        width: 100%;
        background: #1c1c1c;
        color: #e8e8e8;
        border: 1px solid #2e2e2e;
        border-radius: 8px;
        padding: 9px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .btn-scan:hover {
        background: #252525;
      }
      .btn-scan.spinning span {
        display: inline-block;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .net-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
        display: none;
      }
      .net-list.show {
        display: flex;
      }
      .net-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: #1c1c1c;
        border: 1px solid #2e2e2e;
        border-radius: 8px;
        padding: 9px 12px;
        cursor: pointer;
        font-size: 13px;
        transition: border-color 0.15s;
      }
      .net-item:hover {
        border-color: #22c55e;
      }
      .net-item.active {
        border-color: #22c55e;
        background: #0a1a10;
      }
      .net-name {
        color: #e8e8e8;
        font-weight: 500;
      }
      .net-meta {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .net-lock {
        font-size: 11px;
        color: #555;
      }
      .net-bars {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 14px;
      }
      .net-bars span {
        width: 3px;
        background: #555;
        border-radius: 1px;
      }
      .net-bars span.lit {
        background: #22c55e;
      }
      .pw-wrap {
        position: relative;
      }
      .pw-wrap input {
        padding-right: 38px;
      }
      .eye-btn {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: #555;
        font-size: 16px;
        line-height: 1;
        padding: 0;
      }
      .eye-btn:hover {
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <div class="logo">
          <div class="dot">&#9654;</div>
          <div>
            <h1>Stats Counter</h1>
            <div class="sub">Device setup</div>
          </div>
        </div>
      </div>
      <div class="body">
        <div class="status">
          <div class="dot-green"></div>
          Connected &mdash; IP_PLACEHOLDER
        </div>
        <div class="section">Wi-Fi</div>
        <button class="btn-scan" id="scan-btn" onclick="scanNetworks()">
          <span>&#8635;</span> Scan for networks
        </button>
        <div class="net-list" id="net-list"></div>
        <div>
          <label>Network name (SSID)</label
          ><input
            type="text"
            id="ssid"
            placeholder="Leave blank to keep saved"
            value="SSID_PLACEHOLDER"
          />
        </div>
        <div>
          <label
            >Password
            <span style="color: #555; font-weight: 400; text-transform: none"
              >(leave blank to keep saved)</span
            ></label
          >
          <div class="pw-wrap">
            <input
              type="password"
              id="pw"
              placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
            /><button
              class="eye-btn"
              type="button"
              onclick="toggleEye('pw', 'eye-pw')"
            >
              <span id="eye-pw">&#128065;</span>
            </button>
          </div>
        </div>
        <div class="divider"></div>
        <div>
          <label>Scroll message</label>
          <input
            type="text"
            id="scroll-message"
            maxlength="64"
            placeholder="Message to scroll on the display"
            value="SCROLL_MESSAGE_PLACEHOLDER"
          />
        </div>
        <div>
          <label>Scroll speed (ms)</label>
          <input
            type="number"
            id="scroll-speed"
            min="1"
            step="1"
            value="SCROLL_SPEED_PLACEHOLDER"
          />
          <div class="hint">
            Milliseconds between scroll steps when stats animate onto the
            display.
          </div>
        </div>
        <div class="divider"></div>
        <div class="section">Display</div>
        <div>
          <label>Brightness</label>
          <input
            type="number"
            id="brightness"
            min="0"
            max="15"
            step="1"
            value="BRIGHTNESS_PLACEHOLDER"
          />
          <div class="hint">
            Baseline brightness for all text and animations.
          </div>
        </div>
        <div id="msg" class="msg"></div>
        <button class="btn" onclick="save()">Save &amp; connect</button>
        <div class="divider"></div>
        <div class="section">Firmware update</div>
        <div>
          <label>Firmware .bin file</label>
          <input type="file" id="binfile" accept=".bin" />
          <div class="hint">
            PlatformIO build output: .pio/build/esp32dev/firmware.bin
          </div>
        </div>
        <div class="progress-wrap" id="prog-wrap">
          <div class="progress-bar" id="prog-bar"></div>
        </div>
        <div id="ota-msg" class="msg"></div>
        <button class="btn-ota" onclick="uploadFirmware()">
          Upload firmware
        </button>
      </div>
    </div>
    <script>
      var SETUP_STORAGE_KEY = "statsCounterSetup";
      function persistSetupForm() {
        try {
          localStorage.setItem(
            SETUP_STORAGE_KEY,
            JSON.stringify({
              ssid: document.getElementById("ssid").value,
              scrollMessage: document.getElementById("scroll-message").value,
              scrollSpeed: document.getElementById("scroll-speed").value,
              brightness: document.getElementById("brightness").value,
            }),
          );
        } catch (e) {}
      }
      function restoreSetupForm() {
        try {
          var raw = localStorage.getItem(SETUP_STORAGE_KEY);
          if (!raw) return;
          var d = JSON.parse(raw);
          if (d.ssid != null) document.getElementById("ssid").value = d.ssid;
          if (d.scrollMessage != null)
            document.getElementById("scroll-message").value = d.scrollMessage;
          if (d.scrollSpeed != null)
            document.getElementById("scroll-speed").value = d.scrollSpeed;
          if (d.brightness != null)
            document.getElementById("brightness").value = d.brightness;
        } catch (e) {}
      }
      function bindSetupPersist() {
        ["ssid", "scroll-message", "scroll-speed", "brightness"].forEach(
          function (id) {
            document
              .getElementById(id)
              .addEventListener("input", persistSetupForm);
          },
        );
      }
      function barsHtml(rssi) {
        var lvl = rssi > -55 ? 4 : rssi > -65 ? 3 : rssi > -75 ? 2 : 1;
        var h = '<div class="net-bars">';
        var heights = [4, 7, 10, 14];
        for (var i = 0; i < 4; i++) {
          h +=
            '<span style="height:' +
            heights[i] +
            'px"' +
            (i < lvl ? ' class="lit"' : "") +
            " ></span>";
        }
        return h + "</div>";
      }
      function scanNetworks() {
        var btn = document.getElementById("scan-btn");
        var list = document.getElementById("net-list");
        btn.classList.add("spinning");
        btn.disabled = true;
        list.className = "net-list";
        list.innerHTML = "";
        fetch("/scan")
          .then((r) => r.json())
          .then((nets) => {
            btn.classList.remove("spinning");
            btn.disabled = false;
            if (!nets.length) {
              list.innerHTML =
                '<div style="font-size:12px;color:#555;text-align:center">No networks found</div>';
              list.className = "net-list show";
              return;
            }
            list.innerHTML = nets
              .map(function (n) {
                return (
                  '<div class="net-item" onclick="pickNet(this,\'' +
                  n.ssid.replace(/'/g, "\\'") +
                  "')\">" +
                  '<span class="net-name">' +
                  n.ssid +
                  "</span>" +
                  '<span class="net-meta">' +
                  barsHtml(n.rssi) +
                  (n.secure ? '<span class="net-lock">&#128274;</span>' : "") +
                  "</span>" +
                  "</div>"
                );
              })
              .join("");
            list.className = "net-list show";
          })
          .catch(function () {
            btn.classList.remove("spinning");
            btn.disabled = false;
          });
      }
      function pickNet(el, ssid) {
        document.querySelectorAll(".net-item").forEach(function (x) {
          x.classList.remove("active");
        });
        el.classList.add("active");
        document.getElementById("ssid").value = ssid;
        persistSetupForm();
        document.getElementById("pw").focus();
      }
      function toggleEye(inputId, iconId) {
        var inp = document.getElementById(inputId);
        var ico = document.getElementById(iconId);
        if (inp.type === "password") {
          inp.type = "text";
          ico.textContent = "\uD83D\uDE48";
        } else {
          inp.type = "password";
          ico.textContent = "\uD83D\uDC41";
        }
      }
      function save() {
        var s = document.getElementById("ssid").value.trim();
        var p = document.getElementById("pw").value;
        var scrollMessage = document
          .getElementById("scroll-message")
          .value.trim();
        var scrollSpeed = parseInt(
          document.getElementById("scroll-speed").value,
          10,
        );
        var brightness = parseInt(
          document.getElementById("brightness").value,
          10,
        );
        var msg = document.getElementById("msg");
        if (scrollMessage.length > 64) {
          msg.className = "msg err";
          msg.textContent = "Scroll message must be 64 characters or fewer.";
          return;
        }
        if (!scrollSpeed || scrollSpeed <= 0) {
          msg.className = "msg err";
          msg.textContent = "Scroll speed must be greater than 0.";
          return;
        }
        if (isNaN(brightness) || brightness < 0 || brightness > 15) {
          msg.className = "msg err";
          msg.textContent = "Brightness must be 0-15.";
          return;
        }
        persistSetupForm();
        msg.className = "msg ok";
        msg.textContent = "Saving\u2026 device will reboot and connect.";
        fetch("/save", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body:
            "ssid=" +
            encodeURIComponent(s) +
            "&pass=" +
            encodeURIComponent(p) +
            "&scrollMessage=" +
            encodeURIComponent(scrollMessage) +
            "&scrollSpeed=" +
            scrollSpeed +
            "&brightness=" +
            brightness,
        })
          .then((r) => r.text())
          .then((t) => {
            msg.textContent = t;
          });
      }
      function uploadFirmware() {
        var file = document.getElementById("binfile").files[0];
        var omsg = document.getElementById("ota-msg");
        var bar = document.getElementById("prog-bar");
        var wrap = document.getElementById("prog-wrap");
        if (!file) {
          omsg.className = "msg err";
          omsg.textContent = "Select a .bin file first.";
          return;
        }
        if (!file.name.endsWith(".bin")) {
          omsg.className = "msg err";
          omsg.textContent = "File must be a .bin";
          return;
        }
        var xhr = new XMLHttpRequest();
        xhr.open("POST", "/update", true);
        xhr.upload.onprogress = function (e) {
          if (e.lengthComputable) {
            var pct = Math.round((e.loaded / e.total) * 100);
            wrap.className = "progress-wrap show";
            bar.style.width = pct + "%";
            omsg.className = "msg info";
            omsg.textContent = "Uploading\u2026 " + pct + "%";
          }
        };
        xhr.onload = function () {
          if (xhr.status === 200) {
            omsg.className = "msg ok";
            omsg.textContent = "Update complete! Rebooting\u2026";
            bar.style.width = "100%";
          } else {
            omsg.className = "msg err";
            omsg.textContent = "Update failed: " + xhr.responseText;
          }
        };
        xhr.onerror = function () {
          omsg.className = "msg err";
          omsg.textContent = "Upload error. Check connection.";
        };
        var fd = new FormData();
        fd.append("firmware", file, file.name);
        xhr.send(fd);
      }
      restoreSetupForm();
      bindSetupPersist();
    </script>
  </body>
</html>
